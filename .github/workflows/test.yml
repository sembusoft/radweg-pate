name: Tests

# Läuft bei jedem Push und Pull Request auf main. Der Deploy startet davon
# unabhängig nur von Hand (deploy.yml) – Muster wie bei fightReg.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 8.1 = Mindestversion laut Code (never, readonly-freie Syntax), 8.3 = Ziel auf all-inkl.
        php: ['8.1', '8.3']
    # MariaDB 10.11 wie bei all-inkl (dort 10.11.14).
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: radwegpate_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=3s --health-timeout=5s --health-retries=40
    steps:
      - uses: actions/checkout@v5

      - name: PHP ${{ matrix.php }} einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo, gd, pdo_mysql
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: PHP-Syntax
        run: |
          set -e
          for f in public/*.php public/db/*.php scripts/*.php; do php -l "$f"; done

      - name: Statische Prüfungen (Version, CSP, Service Worker, JS-Syntax)
        run: node scripts/check.mjs

      - name: Testserver starten
        run: |
          set -e
          DATA="$GITHUB_WORKSPACE/public/radwegpate_private"   # fest in config.php
          TOKEN="$(php -r 'echo bin2hex(random_bytes(16));')"
          echo "DATA_DIR=$DATA" >> "$GITHUB_ENV"
          echo "INSTALL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # Zugangsdaten wie auf dem Server über public/.env (config.php steht im Repo).
          cat > public/.env <<EOF
          INSTALL_TOKEN=$TOKEN
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=radwegpate_ci
          DB_USER=root
          DB_PASSWORD=ci-root
          ROUTING_PROVIDER=straight
          EOF
          php public/db/check.php
          php public/db/migrate.php
          php public/db/migrate.php --status | grep -q 'Nichts offen'
          (cd public && php -S 127.0.0.1:8080 > "$RUNNER_TEMP/php-server.log" 2>&1 &)
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:8080/api.php?action=status >/dev/null && break; sleep 0.5; done

      - name: Rauchtest (Einrichtung, KML, Kontrollfahrt, Foto, GPX, Passwort)
        env:
          BASE_URL: http://127.0.0.1:8080
        run: node scripts/smoke-test.mjs

      - name: Routenplaner-Antworten (openrouteservice, BRouter) auswerten
        run: php scripts/routing-test.php

      - name: Übernahme der JSON-Altdaten in eine leere Datenbank
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: ci-root
          DB_NAME: radwegpate_import
        run: |
          php -r '$p=new PDO("mysql:host=127.0.0.1","root","ci-root"); $p->exec("CREATE DATABASE radwegpate_import CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php scripts/import-test.php

      - name: PHP-Warnungen im Serverprotokoll?
        if: always()
        run: |
          if grep -iE "PHP (Warning|Notice|Deprecated|Fatal)" "$RUNNER_TEMP/php-server.log"; then
            echo "::error::PHP hat Warnungen ausgegeben (siehe oben)."
            exit 1
          fi
          echo "Keine PHP-Warnungen."

      - name: Serverprotokoll bei Fehlschlag
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/php-server.log" || true
