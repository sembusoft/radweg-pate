# Lokale Testumgebung. Bedienung über .\rp.ps1 (start, stop, test, logs, reset).
name: radwegpate

x-php: &php
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: radwegpate-php:8.3

services:
  # MariaDB 10.11 wie bei all-inkl. Lokale Daten im Volume "dbdata" (bleibt bei stop erhalten,
  # .\rp.ps1 reset löscht es). Datenbank "radwegpate" für die App, "radwegpate_test" legt der Rauchtest
  # bei jedem Lauf neu an.
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: rp-root-lokal
      MARIADB_DATABASE: radwegpate
      MARIADB_USER: radwegpate
      MARIADB_PASSWORD: radwegpate-lokal
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30

  # Deine lokale App: http://localhost:8090 – Fotos in public/radwegpate_private (gitignored),
  # Zugangsdaten in public/.env (legt rp.ps1 beim ersten Start an).
  app:
    <<: *php
    ports:
      - "8090:80"
    volumes:
      - ./public:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # Wegwerf-Instanz für den Rauchtest (nur mit --profile test): eigene Datenbank radwegpate_test.
  test:
    <<: *php
    profiles: ["test"]
    entrypoint: ["/usr/local/bin/test-entrypoint.sh"]
    environment:
      INSTALL_TOKEN: rauchtest-lokal-0123456789abcdef
      DB_ROOT_PASSWORD: rp-root-lokal
    # nicht :ro – Docker muss den Einhängepunkt radwegpate_private anlegen können.
    # Geschrieben wird nur in den tmpfs; deine lokalen Daten sieht diese Instanz nicht.
    volumes:
      - ./public:/var/www/html
    tmpfs:
      - /var/www/html/radwegpate_private:mode=1777
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/api.php?action=status') ? 0 : 1);"]
      interval: 2s
      retries: 30

  # Führt check.mjs und den Rauchtest gegen "test" aus.
  runner:
    image: node:22-alpine
    profiles: ["test"]
    working_dir: /repo
    volumes:
      - ./:/repo:ro
    environment:
      BASE_URL: http://test
      INSTALL_TOKEN: rauchtest-lokal-0123456789abcdef
      CHECK_HTACCESS: "1"
    depends_on:
      test:
        condition: service_healthy
    command: ["sh", "-c", "node scripts/check.mjs && node scripts/smoke-test.mjs"]

volumes:
  dbdata:
